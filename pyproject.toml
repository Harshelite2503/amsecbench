[project]
name = "amsecbench"
version = "0.1.0"
description = "AMSecBench: can LLMs/VLMs detect G-code sabotage and defeat CAD obfuscation in additive manufacturing?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harsh Vardhan Gupta" }]
dependencies = [
  "anthropic>=0.60", "pydantic>=2.7", "numpy>=1.26", "trimesh>=4.4", "shapely>=2.0",
  "scikit-learn>=1.5", "pandas>=2.2", "matplotlib>=3.9", "typer>=0.12", "rich>=13.7",
  "python-dotenv>=1.0", "manifold3d>=2.5", "networkx>=3.2", "rtree>=1.2", "scipy>=1.13",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "python-docx>=1.1"]
[project.scripts]
amsec = "amsec.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["amsec"]
[tool.ruff]
line-length = 100
target-version = "py311"
